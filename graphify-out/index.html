<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seljuk Empire — Dairesel Güneş Kursu Mimarisi (Radial Orbit)</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a10;
      --bg-panel: rgba(12, 17, 28, 0.94);
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold-bright: #e5c158;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 54px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--gold-bright);
      text-transform: uppercase;
    }
    .badge {
      background: rgba(229, 193, 88, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--gold-bright);
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .controls { display: flex; align-items: center; gap: 10px; }
    .search-box input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-gold);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
      width: 220px;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #fff;
      width: 260px;
      background: rgba(255, 255, 255, 0.12);
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-gold);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-bright);
      border-color: var(--gold-bright);
    }

    #radial-container {
      flex: 1;
      height: calc(100vh - 54px);
      width: 100%;
      position: relative;
    }
    #network { width: 100%; height: 100%; }

    /* Quick Clan Selector Bar */
    .quick-bar {
      position: absolute;
      top: 14px; left: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 600px;
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 6px 10px;
      backdrop-filter: blur(12px);
      z-index: 80;
    }
    .quick-pill {
      font-size: 0.72rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 5px;
      transition: all 0.15s;
    }
    .quick-pill:hover { background: rgba(212, 175, 55, 0.2); color: var(--gold-bright); }

    /* Detail Drawer */
    .detail-drawer {
      position: absolute;
      top: 14px; right: 20px;
      width: 320px;
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      display: none;
      z-index: 90;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .detail-header h2 { font-size: 0.95rem; color: #fff; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }
    .close-btn:hover { color: #fff; }
    .detail-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); font-size: 0.78rem; }
    .detail-row span:first-child { color: var(--text-muted); font-size: 0.72rem; }
    .detail-row span:last-child { color: #fff; font-weight: 600; text-align: right; }

    /* Bottom Info Status */
    .status-badge {
      position: absolute;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      border: 1px solid var(--border-gold);
      padding: 5px 16px;
      border-radius: 9999px;
      font-size: 0.74rem;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
      pointer-events: none;
      z-index: 80;
    }
    .status-badge b { color: var(--gold-bright); }
  </style>
</head>
